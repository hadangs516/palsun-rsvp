<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>참석자 명단 · 팔순 감사 찬양 예배</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f8fa;
    --ink: #1f2a44;
    --muted: #566274;
    --line: #d3dde3;
    --field: #ffffff;
    --soft: #e0ece7;
    --accent: #3f7a69;
    --absent: #8a6d2f;
    --btn-bg: #1f2a44;
    --btn-ink: #f5f8fa;
    --error: #a31f17;
    --focus: #1f2a44;
    --serif: "Nanum Myeongjo", "Noto Serif KR", "Batang", serif;
    --sans: "Gowun Dodum", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #10172a;
      --ink: #e8edf5;
      --muted: #9aa7b8;
      --line: #28324a;
      --field: #172036;
      --soft: #1d2d3a;
      --accent: #8fc0ae;
      --absent: #e3c27a;
      --btn-bg: #8fc0ae;
      --btn-ink: #10172a;
      --error: #ff9b86;
      --focus: #8fc0ae;
    }
  }
  :root[data-theme="dark"] {
    --paper: #10172a;
    --ink: #e8edf5;
    --muted: #9aa7b8;
    --line: #28324a;
    --field: #172036;
    --soft: #1d2d3a;
    --accent: #8fc0ae;
    --absent: #e3c27a;
    --btn-bg: #8fc0ae;
    --btn-ink: #10172a;
    --error: #ff9b86;
    --focus: #8fc0ae;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { background: var(--paper); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 48px 22px 64px; }
  h1 { font-family: var(--serif); font-weight: 800; font-size: 26px; line-height: 1.4; margin: 0; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 6px 0 36px; }

  /* 비밀번호 */
  .gate { max-width: 360px; margin: 0 auto; }
  label { display: block; font-size: 15px; color: var(--muted); margin: 0 0 6px 16px; }
  input[type="password"] {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 12px 20px;
  }
  button { font: inherit; cursor: pointer; }
  .primary {
    width: 100%;
    margin-top: 14px;
    font-weight: 700;
    background: var(--btn-bg);
    color: var(--btn-ink);
    border: 0;
    border-radius: 999px;
    padding: 14px 18px;
  }
  .primary:disabled { opacity: 0.6; cursor: default; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .status { min-height: 1.8em; margin: 12px 0 0; text-align: center; font-size: 15px; color: var(--muted); }
  .status.error { color: var(--error); }

  /* 요약 */
  .stats { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 0 0 24px; }
  .stat {
    min-width: 92px;
    padding: 12px 16px;
    border-radius: 999px;
    background: var(--field);
    border: 1px solid var(--line);
    text-align: center;
  }
  .stat b { display: block; font-family: var(--serif); font-size: 24px; line-height: 1.3; }
  .stat span { font-size: 14px; color: var(--muted); }
  .stat.yes b { color: var(--accent); }
  .stat.no b { color: var(--absent); }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--field); overflow: hidden; }
  .filters button { border: 0; background: transparent; color: var(--ink); padding: 8px 16px; font-size: 15px; }
  .filters button + button { border-left: 1px solid var(--line); }
  .filters button[aria-pressed="true"] { background: var(--soft); color: var(--accent); font-weight: 700; }
  .ghost { border: 1px solid var(--line); background: var(--field); color: var(--ink); border-radius: 999px; padding: 8px 16px; font-size: 15px; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); margin: 0 0 16px 4px; }

  /* 목록 */
  .list { list-style: none; margin: 0; padding: 0; }
  .item { padding: 16px 4px; border-bottom: 1px solid var(--line); }
  .item:first-child { border-top: 1px solid var(--line); }
  .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .name { font-family: var(--serif); font-weight: 700; font-size: 18px; }
  .badge { font-size: 13px; padding: 1px 10px; border-radius: 999px; border: 1px solid currentColor; }
  .badge.yes { color: var(--accent); }
  .badge.no { color: var(--absent); }
  .time { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .msg { margin: 6px 0 0; white-space: pre-wrap; }
  .empty { text-align: center; color: var(--muted); padding: 28px 0; }
  .updated { text-align: center; font-size: 13px; color: var(--muted); margin-top: 20px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>참석자 명단</h1>
  <p class="sub">한광흡 장로 팔순 감사 찬양 예배</p>

  <form class="gate" id="gate" novalidate>
    <label for="key">열람 비밀번호</label>
    <input id="key" type="password" autocomplete="current-password">
    <button class="primary" id="open" type="submit">명단 보기</button>
    <p class="status" id="gate-status" role="status" aria-live="polite"></p>
  </form>

  <section id="board" hidden>
    <div class="stats">
      <div class="stat yes"><b id="n-yes">0</b><span>참석</span></div>
      <div class="stat no"><b id="n-no">0</b><span>미참석</span></div>
      <div class="stat"><b id="n-msg">0</b><span>축하글</span></div>
    </div>

    <div class="bar">
      <div class="filters" role="group" aria-label="참석 여부로 거르기">
        <button type="button" data-f="all" aria-pressed="true">전체</button>
        <button type="button" data-f="참석" aria-pressed="false">참석</button>
        <button type="button" data-f="미참석" aria-pressed="false">미참석</button>
      </div>
      <button type="button" class="ghost" id="refresh">새로고침</button>
    </div>
    <label class="check"><input type="checkbox" id="only-msg"> 축하글 있는 것만</label>

    <ul class="list" id="list"></ul>
    <p class="updated" id="updated" role="status" aria-live="polite"></p>
  </section>
</div>

<script>
(function () {
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbw0hxlLi2TSlXW8SMQKgwVfgsUqusBVzqNb8fuibQNigKqCJOJR9oaftSzEsnhU3L5X/exec';

  var gate = document.getElementById('gate');
  var keyEl = document.getElementById('key');
  var openBtn = document.getElementById('open');
  var gateStatus = document.getElementById('gate-status');
  var board = document.getElementById('board');
  var listEl = document.getElementById('list');
  var updatedEl = document.getElementById('updated');
  var onlyMsg = document.getElementById('only-msg');
  var refreshBtn = document.getElementById('refresh');
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll('.filters button'));

  var key = '';
  var rows = [];
  var filter = 'all';

  try { key = sessionStorage.getItem('rsvp-key') || ''; } catch (e) {}

  function setGate(text, isError) {
    gateStatus.textContent = text;
    gateStatus.className = 'status' + (isError ? ' error' : '');
  }

  function load(k) {
    var body = new URLSearchParams();
    body.append('action', 'list');
    body.append('key', k);
    return fetch(WEBAPP_URL, { method: 'POST', body: body }).then(function (r) { return r.json(); });
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function render() {
    var yes = 0, no = 0, msgs = 0;
    rows.forEach(function (r) {
      if (r.attend === '참석') yes++;
      else if (r.attend === '미참석') no++;
      if (r.message) msgs++;
    });
    document.getElementById('n-yes').textContent = yes;
    document.getElementById('n-no').textContent = no;
    document.getElementById('n-msg').textContent = msgs;

    var shown = rows.filter(function (r) {
      if (filter !== 'all' && r.attend !== filter) return false;
      if (onlyMsg.checked && !r.message) return false;
      return true;
    }).slice().reverse();

    listEl.textContent = '';
    if (!shown.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = rows.length ? '조건에 맞는 응답이 없습니다.' : '아직 들어온 응답이 없습니다.';
      listEl.appendChild(li);
      return;
    }
    shown.forEach(function (r) {
      var li = document.createElement('li');
      li.className = 'item';
      var head = document.createElement('div');
      head.className = 'head';
      var n = document.createElement('span');
      n.className = 'name';
      n.textContent = r.name;
      var b = document.createElement('span');
      b.className = 'badge ' + (r.attend === '참석' ? 'yes' : 'no');
      b.textContent = r.attend;
      var t = document.createElement('span');
      t.className = 'time';
      t.textContent = r.time;
      head.appendChild(n);
      head.appendChild(b);
      head.appendChild(t);
      li.appendChild(head);
      if (r.message) {
        var m = document.createElement('p');
        m.className = 'msg';
        m.textContent = r.message;
        li.appendChild(m);
      }
      listEl.appendChild(li);
    });
  }

  function open(k, fromSaved) {
    openBtn.disabled = true;
    refreshBtn.disabled = true;
    if (!fromSaved) setGate('불러오는 중입니다.', false);
    return load(k).then(function (res) {
      if (!res || !res.ok) {
        try { sessionStorage.removeItem('rsvp-key'); } catch (e) {}
        board.hidden = true;
        gate.hidden = false;
        setGate('비밀번호가 맞지 않습니다.', true);
        keyEl.focus();
        return;
      }
      key = k;
      try { sessionStorage.setItem('rsvp-key', k); } catch (e) {}
      rows = Array.isArray(res.rows) ? res.rows : [];
      gate.hidden = true;
      board.hidden = false;
      render();
      var now = new Date();
      updatedEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ' 기준';
    }).catch(function () {
      if (board.hidden) setGate('불러오지 못했습니다. 잠시 뒤에 다시 시도해 주세요.', true);
      else updatedEl.textContent = '새로고침하지 못했습니다. 잠시 뒤에 다시 시도해 주세요.';
    }).then(function () {
      openBtn.disabled = false;
      refreshBtn.disabled = false;
    });
  }

  gate.addEventListener('submit', function (e) {
    e.preventDefault();
    var k = keyEl.value.trim();
    if (!k) { setGate('비밀번호를 입력해 주세요.', true); keyEl.focus(); return; }
    open(k, false);
  });

  refreshBtn.addEventListener('click', function () {
    updatedEl.textContent = '불러오는 중입니다.';
    open(key, true);
  });

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      filter = btn.getAttribute('data-f');
      filterBtns.forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
      render();
    });
  });
  onlyMsg.addEventListener('change', render);

  if (key) open(key, true);
})();
</script>
</body>
</html>
